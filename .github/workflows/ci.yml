name: CI

on:
  push:
    branches: [main]
  pull_request:

# Single source of truth for the Go toolchain version. Bumping here updates
# every job below; keep in sync with the `go` directive in go.mod.
env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.6.0"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod tidy (verify)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum out of date — run 'go mod tidy'" && exit 1)
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (with coverage)
        run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -20
      - name: upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Use the repo's .golangci.yml; fail the job on any reported issue.
          args: --timeout=5m
