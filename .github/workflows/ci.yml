name: CI

on:
  push:
    branches: [main]
  pull_request:

# Single source of truth for the toolchain versions. Bumping here updates
# every job below; keep `GO_VERSION` in sync with the `go` directive in go.mod.
env:
  GO_VERSION: "1.26.2"
  GOLANGCI_LINT_VERSION: "latest"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod tidy (verify)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum out of date — run 'go mod tidy'" && exit 1)
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (with coverage)
        run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -20
      - name: upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      GO111MODULE: "on"
    steps:
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Checkout source
        uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: golangci-lint
        # v9 of the action installs golangci-lint v2 by default; using
        # `latest` ensures we always pick up a version that supports the
        # repo's targeted Go release.
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
